:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#050a1a}

html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;font-family:"Arial Black",Arial,sans-serif}
body{display:flex;align-items:center;justify-content:center}

#pad button:active{filter:brightness(1.2);opacity:.8}

#pad .u{left:calc(var(--sw)*.0835);bottom:calc(var(--sw)*.157)}#pad .dn{left:calc(var(--sw)*.0835);bottom:calc(var(--sw)*.01)}
#pad .l{left:calc(var(--sw)*.01);bottom:calc(var(--sw)*.0835)}#pad .r{left:calc(var(--sw)*.157);bottom:calc(var(--sw)*.0835)}

function bfs(sx,sy,blk=-1,m=M){const d=new Int16Array(W*H).fill(9999),q=new Int32Array(W*H);let a=0,b=0;d[sy*W+sx]=0;q[b++]=sy*W+sx;
 while(a<b){const i=q[a++],cx=i%W,cy=(i/W)|0;for(let k=0;k<4;k++){const nx=cx+DX[k],ny=cy+DY[k],j=ny*W+nx;if(nx>=0&&ny>=0&&nx<W&&ny<H&&m[ny][nx]!==1&&j!==blk&&d[j]===9999){d[j]=d[i]+1;q[b++]=j}}}return d}

  const m=rows.map(r=>Uint8Array.from(r,ch=>ch==='#'?1:0)),d=bfs(15,sy,-1,m),open=(i,j)=>[[1,0],[-1,0],[0,1],[0,-1]].filter(([a,b])=>m[j+b]&&m[j+b][i+a]===0).length,roads=[],dead=[];
